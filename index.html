<script>
const SONG={"id":"song-175r-sora-ni-utaeba","song_code":"MJE-LAGU-000005","artist_romaji":"175R","title_romaji":"Sora ni Utaeba","year":"-","theme":"persahabatan/kenangan/mimpi/harapan","japanese_lyrics":"空を見上げて雲を見つめる\n過ぎ去りし時の空 雲の行方は\n青い桜の花は散らない\n小さなこの両手で夢を掴もうとしてた\n\n友の声は遥か遠くに\n僕の心の中で絶えずに響いて...\n\n朝が来るまで語り明かした\n僕らが夢見ていた約束の街\n\n何も恐いモノなんてなかった\n目に映る全てが希望に見えた\n道に迷い 笑いあって\n目の前の光 探し続けた\n\n友の声よ遥か遠くに\n僕の心の中で絶えずに響いて...\n\nあの日の僕等はそこに立っていて\n何も言わずにこっちを見ている\nあの日の夢は今も僕の事を縛りつけて\n何も変わらずずっと流れてる\n\n愛しき人よ 空に歌った\n僕らの声は今でも絶えずに響いて...\n\nあの日の僕等はそこに立っていて\n何も言わずにこっちを見ている\n遠くを見るような目で僕の事を睨みつけて\n何も言わずにじっと見つめてる\n\n僕らが過ごしたあの日々は\n何も変わらずあの日のまま\n明日へ繋がるこの道に\n大きな足跡残してやれ\n\nあの日の僕等はそこに立っていて\n何も言わずにこっちを見ている\nあの日の夢は今も僕の事を縛りつけて\n何も言わずにじっと見つめてる\n\n形じゃなくて 言葉じゃなくて\nこの胸の高なりよ 届け 僕の想いよ","romaji_lyrics":"Sora o miagete kumo o mitsumeru\nSugisarishi toki no sora kumo no yukue wa\nAoi sakura no hana wa chiranai\nChiisana kono ryoute de yume o tsukamou to shiteta\n\nTomo no koe wa haruka tooku ni\nBoku no kokoro no naka de taezu ni hibiite...\n\nAsa ga kuru made katariakashita\nBokura ga yumemiteita yakusoku no machi\n\nNani mo kowai mono nante nakatta\nMe ni utsuru subete ga kibou ni mieta\nMichi ni mayoi waraiatte\nMe no mae no hikari sagashitsuzuketa\n\nTomo no koe yo haruka tooku ni\nBoku no kokoro no naka de taezu ni hibiite...\n\nAno hi no bokura wa soko ni tatteite\nNani mo iwazu ni kocchi o miteiru\nAno hi no yume wa ima mo boku no koto o shibaritsukete\nNani mo kawarazu zutto nagareteru\n\nItoshiki hito yo sora ni utatta\nBokura no koe wa ima demo taezu ni hibiite...\n\nAno hi no bokura wa soko ni tatteite\nNani mo iwazu ni kocchi o miteiru\nTooku o miru you na me de boku no koto o niramitsukete\nNani mo iwazu ni jitto mitsumeteru\n\nBokura ga sugoshita ano hibi wa\nNani mo kawarazu ano hi no mama\nAshita e tsunagaru kono michi ni\nOokina ashiato nokoshite yare\n\nAno hi no bokura wa soko ni tatteite\nNani mo iwazu ni kocchi o miteiru\nAno hi no yume wa ima mo boku no koto o shibaritsukete\nNani mo iwazu ni jitto mitsumeteru\n\nKatachi janakute kotoba janakute\nKono mune no takanari yo todoke boku no omoi yo","indonesian_translation":"Menatap ke langit dan memandang awan\nLangit dari waktu yang telah berlalu, ke mana awan itu pergi\nBunga sakura biru tak akan berguguran\nDengan kedua tangan kecil ini, dulu aku mencoba meraih mimpi\n\nSuara sahabat terdengar dari kejauhan\nNamun terus bergema tanpa henti di dalam hatiku...\n\nKami berbincang sampai pagi tiba\nKota yang dijanjikan, yang dulu kami impikan\n\nSaat itu tak ada apa pun yang kami takuti\nSegala yang terlihat oleh mata tampak seperti harapan\nTersesat di jalan, lalu tertawa bersama\nKami terus mencari cahaya di depan mata\n\nSuara sahabat, dari kejauhan\nTerus bergema tanpa henti di dalam hatiku...\n\nKami yang saat itu masih berdiri di sana\nTanpa berkata apa-apa, menatap ke arah sini\nMimpi pada hari itu masih membelengguku hingga sekarang\nTerus mengalir tanpa berubah sedikit pun\n\nWahai orang yang kusayangi, aku bernyanyi ke langit\nSuara kami bahkan sekarang masih terus bergema...\n\nKami yang saat itu masih berdiri di sana\nTanpa berkata apa-apa, menatap ke arah sini\nDengan mata seakan memandang jauh, menatapku tajam\nTanpa berkata apa-apa, terus menatapku\n\nHari-hari yang pernah kami lalui\nMasih tetap sama seperti hari itu\nDi jalan yang terhubung menuju hari esok ini\nTinggalkanlah jejak langkah yang besar\n\nKami yang saat itu masih berdiri di sana\nTanpa berkata apa-apa, menatap ke arah sini\nMimpi pada hari itu masih membelengguku hingga sekarang\nTanpa berkata apa-apa, terus menatapku\n\nBukan dalam bentuk, bukan pula dalam kata-kata\nDebaran di dada ini, sampailah—wahai perasaanku","source_type":"youtube","youtube_url":"https://www.youtube.com/watch?v=dHUJAHPhPJk"};
let source="";
const f=document.getElementById("file"), go=document.getElementById("go"), log=document.getElementById("log");
f.onchange=async()=>{
 const file=f.files[0]; if(!file)return;
 source=await file.text();
 log.textContent="Source terbaca: "+file.name+" ("+source.length.toLocaleString()+" karakter)";
 go.disabled=false;
};
go.onclick=()=>{
 try{
  let html=source;
  if(!html.includes(SONG.id)){
   const payload=JSON.stringify(SONG);
   const rx=/((?:const|var|let)\s+BUILTIN_SONGS\s*=\s*\[)/g;
   const found=[...html.matchAll(rx)].length;
   if(!found)throw new Error("BUILTIN_SONGS tidak ditemukan.");
   html=html.replace(rx, "$1"+payload+",");
   log.textContent="Berhasil. "+found+" definisi BUILTIN_SONGS di-update.";
  } else {
   log.textContent="Lagu sudah ada. File tetap divalidasi dan disimpan.";
  }
  const checks=["あの日の夢は今も僕の事を縛りつけて","Ano hi no yume wa ima mo boku no koto o shibaritsukete",SONG.youtube_url];
  for(const c of checks) if(!html.includes(c)) throw new Error("Validasi gagal: "+c);
  const blob=new Blob([html],{type:"text/html;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="index.html"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
 }catch(e){log.textContent="GAGAL: "+e.message;}
};
